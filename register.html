<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration | NURA AI LABS</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class=" row justify-content-center">
<div class="model1">
    <form id="registerForm">
        <div class="text-center"><h2>Create account</h2></div>
        <div><label for= fullname>Full Name</label>
        <input type="text" class="form-control" name="fullname" placeholder="Enter your fullname"></div>
        <br>
        <div><label for= email>Email ID</label>
        <input type="text" class="form-control" name="email" placeholder="Enter your Email ID"></div>
        <br>
        <div><label for=password>Password</label>
        <input type="password" class="form-control" name="password" placeholder="Create a Password"></div>
        <br>
        <div><label for=password> Confirm Password</label>
        <input type="password" class="form-control" name="cpassword" placeholder="Confirm your Password"></div>
        <br>
        <div id="message" class="mb-3"></div>
        <div><button type="submit"  class="btn-outline-danger w-100">Register</button></div>
        <br>
        <div><p class="text-center">Already have an account? <a href="login.html">Login here</a></p></div>
    </form>
    
</div>
</div>   

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Registration JavaScript -->
    <script src="js/register.js"></script>

</body>
</html>
